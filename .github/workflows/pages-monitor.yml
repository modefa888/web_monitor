# 定时采集监控数据并更新静态看板（Pages 版）
#
# 说明：
# - cron 用 UTC 时间，最低间隔 5 分钟（GitHub Actions 限制）
#   例：每 5 分钟 = "*/5 * * * *"；北京时间 0 点 = "0 16 * * *"
# - 采集结果提交回仓库后，GitHub Pages 会自动发布最新看板
name: 监控采集

on:
  schedule:
    - cron: "*/5 * * * *"        # 每 5 分钟（UTC）
  workflow_dispatch:             # 支持在 Actions 页面手动触发

permissions:
  contents: write                # 允许提交采集结果

concurrency:
  group: monitor-collect
  cancel-in-progress: false      # 上一次没跑完就等它，避免结果互相覆盖

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行监控采集
        run: python pages_edition/runner.py

      - name: 提交采集结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data pages_edition/state.json
          if git diff --cached --quiet; then
            echo "结果无变化，跳过提交"
          else
            git commit -m "采集结果更新 $(date -u +%FT%TZ)"
            git push
          fi
